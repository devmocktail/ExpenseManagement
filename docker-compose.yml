# Local development stack: PostgreSQL + the API.
#
#   docker compose up --build
#   API      -> http://localhost:5165
#   Swagger  -> http://localhost:5165/swagger
#   Postgres -> localhost:5432  (postgres / the password in .env)
#
# Create a .env beside this file first:
#   POSTGRES_PASSWORD=Your_Strong_Passw0rd!
#   JWT_SECRET=at-least-32-characters-of-random-text
#
# NOTE: this file has never been executed. Docker was not installed on the
# machine it was written on, so treat the first run as untested and expect to
# fix something.

services:
  db:
    image: postgres:17-alpine
    container_name: expense-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: ExpenseManagement
    ports:
      # Exposed so psql and EF tooling on the host can reach it. Drop this
      # mapping if you only ever talk to the database from the API container.
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # The API must not start until Postgres is actually accepting queries.
      # The container reports "running" before that, and a migration fired into
      # the gap fails with a connection error that looks like a config bug.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ExpenseManagement"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 8080

      # `db` is the compose service name, resolved on the compose network.
      # localhost inside this container is the container itself.
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=ExpenseManagement;Username=postgres;Password=${POSTGRES_PASSWORD}

      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Jwt__Issuer: ExpenseManagement.Api
      Jwt__Audience: ExpenseManagement.Mobile

      Database__MigrateOnStartup: "true"

      Seed__DemoUser: "true"
      Seed__DemoPassword: ${DEMO_PASSWORD:-Demo@Pass123!}

      FileStorage__RootPath: /app/storage
    ports:
      - "5165:8080"
    volumes:
      # Receipts survive a container rebuild. Without this a `compose up
      # --build` silently discards every uploaded image.
      - receipts:/app/storage
    restart: unless-stopped

volumes:
  pg-data:
  receipts:
