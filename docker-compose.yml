# Local development stack: SQL Server + the API.
#
#   docker compose up --build
#   API      -> http://localhost:5165
#   Swagger  -> http://localhost:5165/swagger
#   SQL      -> localhost,1433   (sa / the password in .env)
#
# Create a .env beside this file first:
#   MSSQL_SA_PASSWORD=Your_Strong_Passw0rd!
#   JWT_SECRET=at-least-32-characters-of-random-text
#
# NOTE: this file has never been executed. Docker was not installed on the
# machine it was written on, so treat the first run as untested and expect to
# fix something.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: expense-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      # Exposed so SSMS and EF tooling on the host can reach it. Drop this
      # mapping if you only ever talk to the database from the API container.
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The API must not start until SQL Server is actually accepting queries.
      # The container reports "running" long before that, and a migration fired
      # into the gap fails with a connection error that looks like a config bug.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 8080

      # `db` is the compose service name, resolved on the compose network.
      # localhost inside this container is the container itself.
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;Database=ExpenseManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true

      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Jwt__Issuer: ExpenseManagement.Api
      Jwt__Audience: ExpenseManagement.Mobile

      Database__MigrateOnStartup: "true"

      Seed__DemoUser: "true"
      Seed__DemoPassword: ${DEMO_PASSWORD:-Demo@Pass123!}

      FileStorage__RootPath: /app/storage
    ports:
      - "5165:8080"
    volumes:
      # Receipts survive a container rebuild. Without this a `compose up
      # --build` silently discards every uploaded image.
      - receipts:/app/storage
    restart: unless-stopped

volumes:
  mssql-data:
  receipts:
